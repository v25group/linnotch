[package]
name = "linnotch"
version = "0.1.0-alpha.2"
description = "linnotch: a Dynamic Island for Windows"
authors = ["V25Group (Venticinque Aeyon Groupe)"]
license = "MIT"
homepage = "https://github.com/v25group/linnotch"
repository = "https://github.com/v25group/linnotch"
edition = "2024"
# `notch` (src/bin/notch.rs) is a second, console binary; `cargo run` / `tauri dev` start the island.
default-run = "linnotch"

[lib]
# The `_lib` suffix keeps the lib name from clashing with the bin name on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "linnotch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] } # keeps key order when editing ~/.claude/settings.json
lofty = "0.25.4"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
png = "0.17"
ureq = "3"
arboard = "3.7.0"
tauri-plugin-drag = "2"

[target.'cfg(windows)'.dependencies]
base64 = "0.22"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Power", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Com", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Foundation", "Foundation_Collections", "Devices_Enumeration", "Devices_Bluetooth", "ApplicationModel", "ApplicationModel_Appointments", "UI_Notifications", "UI_Notifications_Management", "Media_Control", "Storage_Streams", "Win32_Graphics_Gdi", "Win32_System_Ole", "Win32_System_DataExchange", "Win32_System_Memory", "UI_Shell", "Devices_Radios", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Console", "Win32_System_Environment", "Win32_System_Diagnostics_ToolHelp"] }
windows-collections = "0.3"
windows-core = "0.62"
winreg = "0.56.0"
minisign-verify = "0.2"
wmi = "0.18.4"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
